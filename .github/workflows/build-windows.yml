name: Budowanie i wydanie SkyCatalog (Windows)

# Każdy push do main (oraz ręczne uruchomienie na main) tworzy wydanie GitHub Release
# z wersją MAJOR.MINOR (plik VERSION) + kolejny numer poprawki z tagów, np. v1.2.1, v1.2.2…
# Push na inne gałęzie tylko buduje i testuje (artefakt do pobrania, bez wydania) – z numerem,
# który dostałoby następne wydanie.
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      overpass:
        description: "Uruchom diagnostykę Overpass na prawdziwych danych (kilka zapytań)"
        type: boolean
        default: false

permissions:
  contents: write

# Wydania z main jedno po drugim – dwa szybkie pushe nie dostaną tego samego numeru
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'wydanie-main' || github.run_id }}
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tagi wydań – do wyliczenia kolejnego numeru wersji

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wersja (MAJOR.MINOR z pliku VERSION + kolejny numer poprawki)
        shell: pwsh
        run: |
          git fetch --tags --force --quiet
          $version = python narzedzia/wersja.py --z-tagow
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Wersja: $version"
          # Wersja podana ręcznie w VERSION (MAJOR.MINOR.PATCH) mogła już zostać wydana – nie nadpisujemy wydań
          $exists = [bool](git tag --list "v$version")
          "TAG_EXISTS=$($exists.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($exists) { "::warning::Wydanie v$version już istnieje – nowe wydanie nie zostanie utworzone. Zmień numer w pliku VERSION." }

      - name: Instalacja zależności
        run: python -m pip install -r requirements-dev.txt pillow

      - name: Testy (w tym testy Windows, PySide6 i skryptu aktualizacji)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v

      - name: Budowanie aplikacji (folder przenośny)
        run: python -m PyInstaller --clean --noconfirm sortowanie.spec

      - name: Rozmiar i samotest zbudowanego programu
        shell: pwsh
        run: |
          $size = (Get-ChildItem dist\SkyCatalog -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          "Rozmiar folderu: {0:N0} MB" -f $size
          Get-ChildItem dist\SkyCatalog -Recurse -File | Sort-Object Length -Descending | Select-Object -First 12 |
            ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length / 1MB), $_.FullName.Substring((Resolve-Path dist\SkyCatalog).Path.Length) }
          $exe = Get-Item dist\SkyCatalog\SkyCatalog.exe
          "Wersja w metadanych .exe: $($exe.VersionInfo.FileVersion) / $($exe.VersionInfo.ProductVersion)"
          if ($exe.VersionInfo.ProductVersion -ne $env:APP_VERSION) { throw "Metadane .exe nie zawierają wersji $env:APP_VERSION" }
          $env:APPDATA = "$env:RUNNER_TEMP\selftest\appdata"
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\selftest\local"
          New-Item -ItemType Directory -Force "$env:APPDATA\SkyCatalog" | Out-Null
          '{"offline": true, "tile_url": "https://kafelki.invalid/{z}/{x}/{y}.png"}' | Set-Content -Encoding utf8 "$env:APPDATA\SkyCatalog\ustawienia.json"
          $env:SKYCATALOG_SELFTEST = "$env:RUNNER_TEMP\selftest.png"
          $p = Start-Process -FilePath $exe.FullName -PassThru -Wait
          $result = Get-Content "$env:RUNNER_TEMP\selftest.json" -Raw
          "Samotest: kod $($p.ExitCode), $result"
          if ($p.ExitCode -ne 0) { throw "Samotest programu nie powiódł się" }
          $json = $result | ConvertFrom-Json
          if ($json.wersja -ne $env:APP_VERSION) { throw "Program zgłasza złą wersję" }
          # HTTPS w zbudowanym .exe: certyfikaty weryfikowane przez Windows (truststore), bez błędów TLS
          if ($json.tls -notlike "truststore*") { throw "Weryfikacja TLS nie używa truststore: $($json.tls)" }
          if ($json.aktualizacje_blad -match "SSL|CERTIFICATE|certificate") { throw "Błąd TLS przy sprawdzaniu aktualizacji: $($json.aktualizacje_blad)" }

      - name: Zrzuty ekranu (przykładowe dane, bez pobierania kafelków)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:APPDATA = "$env:RUNNER_TEMP\appdata"
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\local"
          $demo = "$env:RUNNER_TEMP\demo"
          python narzedzia/dane_demo.py "$demo"
          New-Item -ItemType Directory -Force "$env:APPDATA\SkyCatalog" | Out-Null
          # Podkład wyłączony (nieistniejący host): automat nie pobiera kafelków z serwerów OSM.
          $settings = @{ offline = $true; scan_drives = @("$demo"); tile_url = "https://kafelki.invalid/{z}/{x}/{y}.png" } | ConvertTo-Json
          $settings | Set-Content -Encoding utf8 "$env:APPDATA\SkyCatalog\ustawienia.json"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Snap($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            New-Item -ItemType Directory -Force zrzuty | Out-Null
            $bmp.Save("zrzuty\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $small = New-Object System.Drawing.Bitmap $bmp, ([int]($b.Width * 0.75)), ([int]($b.Height * 0.75))
            $ms = New-Object System.IO.MemoryStream
            $small.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
            $b64 = [Convert]::ToBase64String($ms.ToArray())
            "ZRZUT-BASE64-START $name"
            for ($i = 0; $i -lt $b64.Length; $i += 4000) { $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i)) }
            "ZRZUT-BASE64-END"
          }
          $p = Start-Process -FilePath "dist\SkyCatalog\SkyCatalog.exe" -ArgumentList "--mapa", "--skanuj" -PassThru
          Start-Sleep -Seconds 40
          Snap "mapa"
          "Proces działa: $(-not $p.HasExited)"
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Start-Sleep -Seconds 2
          $p = Start-Process -FilePath "dist\SkyCatalog\SkyCatalog.exe" -ArgumentList "`"$demo\Karta`"" -PassThru
          Start-Sleep -Seconds 25
          Snap "sortowanie"
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }

      - name: Diagnostyka Overpass na prawdziwych danych
        if: github.event_name == 'workflow_dispatch' && inputs.overpass
        continue-on-error: true
        run: python narzedzia/sprawdz_lokalizacje.py 50.027082,22.003366 50.040451,21.999130

      - name: Spakowanie całego folderu programu
        shell: pwsh
        run: Compress-Archive -Path dist\SkyCatalog -DestinationPath SkyCatalog-portable.zip

      - name: Test aktualizacji end-to-end (stara wersja 0.9.0 -> nowa)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = (Resolve-Path SkyCatalog-portable.zip).Path
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          # „Stara” wersja: ten sam kod zbudowany z numerem 0.9.0
          Copy-Item VERSION VERSION.bak
          Set-Content -NoNewline -Path VERSION -Value "0.9.0"
          python narzedzia/wersja.py --z-tagow | Out-Null
          python -m PyInstaller --noconfirm --distpath dist_old --workpath build_old sortowanie.spec | Out-Null
          Move-Item -Force VERSION.bak VERSION
          $old = Join-Path $env:RUNNER_TEMP "Programy\Sky Catalog & O'Brien"
          New-Item -ItemType Directory -Force $old | Out-Null
          Copy-Item -Recurse -Force dist_old\SkyCatalog\* $old
          Set-Content -Path (Join-Path $old "ustawienia.json") -Value "dane uzytkownika obok programu"
          $env:APPDATA = "$env:RUNNER_TEMP\upd\appdata"
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\upd\local"
          New-Item -ItemType Directory -Force "$env:APPDATA\SkyCatalog" | Out-Null
          '{"offline": true, "tile_url": "https://kafelki.invalid/{z}/{x}/{y}.png"}' | Set-Content -Encoding utf8 "$env:APPDATA\SkyCatalog\ustawienia.json"
          # Skróty: do aktualizowanej kopii i do innej (nieaktualnej) kopii programu
          $desk = [Environment]::GetFolderPath("Desktop")
          $sh = New-Object -ComObject WScript.Shell
          $l1 = $sh.CreateShortcut("$desk\SkyCatalog test.lnk"); $l1.TargetPath = "$old\SkyCatalog.exe"; $l1.Save()
          $l2 = $sh.CreateShortcut("$desk\SkyCatalog inna kopia.lnk"); $l2.TargetPath = "C:\InnaKopia\SkyCatalog.exe"; $l2.Save()
          @{ zip = $zip; version = $env:APP_VERSION; sha256 = $sha } | ConvertTo-Json | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\upd.json"
          $env:SKYCATALOG_UPDATE_SELFTEST = "$env:RUNNER_TEMP\upd.json"
          $before = (Get-Item "$old\SkyCatalog.exe").VersionInfo.ProductVersion
          "Przed aktualizacją: $before"
          $p = Start-Process -FilePath "$old\SkyCatalog.exe" -PassThru
          "Stara wersja uruchomiona, pid $($p.Id)"
          $work = Join-Path $env:TEMP "SkyCatalog-aktualizacja-$env:APP_VERSION"
          $resultFile = Join-Path $work "wynik.json"
          $deadline = (Get-Date).AddMinutes(8)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $resultFile)) { Start-Sleep 2 }
          # nowa wersja kończy się sama po odczycie wyniku (tryb testu)
          $until = (Get-Date).AddMinutes(2)
          while ((Get-Date) -lt $until -and (Test-Path "$env:LOCALAPPDATA\SkyCatalog\aktualizacja_oczekuje.json")) { Start-Sleep 1 }
          $log = "$env:LOCALAPPDATA\SkyCatalog\logs\aktualizacja.log"
          "===== Dziennik aktualizacji ====="
          if (Test-Path $log) { Get-Content $log } else { "(brak dziennika)" }
          if (-not (Test-Path $resultFile)) { throw "Brak wyniku aktualizacji" }
          $r = Get-Content $resultFile -Raw | ConvertFrom-Json
          "Wynik: $($r | ConvertTo-Json -Compress)"
          $after = (Get-Item "$old\SkyCatalog.exe").VersionInfo.ProductVersion
          $backup = (Get-Item "$old\_backup\SkyCatalog.exe").VersionInfo.ProductVersion
          "Po aktualizacji: $after (kopia zapasowa: $backup)"
          if ($r.status -ne "ok") { throw "Aktualizacja nie powiodła się: $($r.status)" }
          if ($before -ne "0.9.0") { throw "Zła wersja startowa: $before" }
          if ($after -ne $env:APP_VERSION) { throw "Plik programu nie raportuje nowej wersji: $after" }
          if ($backup -ne "0.9.0") { throw "Kopia zapasowa nie zawiera poprzedniej wersji" }
          if (-not (Select-String -Path $log -SimpleMatch "raportuje wersje $env:APP_VERSION")) { throw "Brak potwierdzenia nowej wersji w dzienniku" }
          if ((Get-Content (Join-Path $old "ustawienia.json") -Raw).Trim() -ne "dane uzytkownika obok programu") { throw "Nadpisano dane użytkownika" }
          if (-not ($r.skroty_nieaktualne | Where-Object { $_ -like "*inna kopia*" })) { throw "Nie wykryto skrótu do innej kopii" }
          if (-not ($r.skroty_poprawne | Where-Object { $_ -like "*SkyCatalog test*" })) { throw "Skrót do aktualizowanej kopii nie został rozpoznany" }
          if (Test-Path "$env:LOCALAPPDATA\SkyCatalog\aktualizacja_oczekuje.json") { throw "Nowa wersja nie zakończyła obsługi aktualizacji" }
          Remove-Item "$desk\SkyCatalog test.lnk", "$desk\SkyCatalog inna kopia.lnk" -ErrorAction SilentlyContinue
          "Test aktualizacji end-to-end: OK"

      - uses: actions/upload-artifact@v4
        with:
          name: SkyCatalog-portable-${{ env.APP_VERSION }}
          path: SkyCatalog-portable.zip
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zrzuty-ekranu
          path: zrzuty/
          if-no-files-found: ignore
          retention-days: 14

      - name: Wydanie GitHub Release (tylko main)
        if: github.ref == 'refs/heads/main' && env.TAG_EXISTS != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: SkyCatalog ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: SkyCatalog-portable.zip
